name: Выпуск

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Версия
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Тег = APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*APP_VERSION = "\([0-9.]*\)".*/\1/p' app/src/commonMain/kotlin/dev/iskandern/kotin/AppVersion.kt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::тег $GITHUB_REF_NAME, а APP_VERSION = $version"
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            format: msi
          - os: macos
            runner: macos-latest
            format: dmg
          - os: linux
            runner: ubuntu-latest
            format: deb
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:packageDistributionForCurrentOS
      - name: Переименовать
        run: |
          mkdir out
          cp app/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }} out/KoTIN-${{ matrix.os }}.${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
          retention-days: 7

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # без ключа androidApp подпишет debug-ключом: такой APK не обновится поверх подписанного и наоборот
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::нет секрета RELEASE_KEYSTORE_BASE64 — APK подписан debug-ключом"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew :androidApp:assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Переименовать
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir out
          cp androidApp/build/outputs/apk/release/androidApp-release.apk out/KoTIN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/KoTIN.apk
          retention-days: 7

  # Web-версия на GitHub Pages: https://iskandern.github.io/KoTIN/ (источник Pages — GitHub Actions)
  web:
    name: Web → GitHub Pages
    needs: version
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:wasmJsBrowserDistribution
      - name: Собрать сайт
        run: |
          mkdir site
          cp -r app/build/dist/wasmJs/productionExecutable/. site/
          find site -name '*.map' -delete
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" files/* -R "$GITHUB_REPOSITORY" --title "KoTIN ${GITHUB_REF_NAME#v}" --generate-notes
